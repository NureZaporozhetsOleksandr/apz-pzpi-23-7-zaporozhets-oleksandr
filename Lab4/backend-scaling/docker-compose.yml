services:
  backend-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: worktime-backend-1
    environment:
      - PORT=3000
      - INSTANCE_NAME=backend-1
      - JWT_SECRET=worktime-secret
    ports:
      - "3001:3000"

  backend-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: worktime-backend-2
    environment:
      - PORT=3000
      - INSTANCE_NAME=backend-2
      - JWT_SECRET=worktime-secret
    ports:
      - "3002:3000"

  backend-3:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: worktime-backend-3
    environment:
      - PORT=3000
      - INSTANCE_NAME=backend-3
      - JWT_SECRET=worktime-secret
    ports:
      - "3003:3000"

  nginx:
    image: nginx:alpine
    container_name: worktime-load-balancer
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2
      - backend-3